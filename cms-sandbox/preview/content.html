<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>자료 미리보기 | EEAMS 관리</title><link rel="stylesheet" href="preview.css"><link rel="stylesheet" href="content.css"><link rel="stylesheet" href="admin-layout.css"></head><body class="admin-page preview-page">
<header><img src="../../assets/eeams-wordmark-black.png" alt="EEAMS" width="104" height="32"><div><p class="eyebrow">EEAMS 관리</p><h1><span id="title">자료 미리보기</span></h1></div><nav class="header-links" aria-label="관리 도구"><a data-manager-return href="/manage">관리 시작</a></nav></header>
<main><div class="intro"><p>편집 화면에서 저장한 자료를 확인합니다. 수정 후 ‘저장본 새로고침’을 눌러주세요.</p></div>
<div class="toolbar admin-toolbar"><label>관리 자료<select id="kind"><option value="people">참여자</option><option value="education">특강·워크숍</option><option value="research">연구 프로젝트</option></select></label><div class="toolbar-actions"><button id="reload" type="button">저장본 새로고침</button><a id="edit" class="button primary" target="_blank" rel="noopener noreferrer">자료 편집 ↗</a></div></div>
