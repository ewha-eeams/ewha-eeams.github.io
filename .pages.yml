{
  "media": [
    {
      "name": "concert_trial_media",
      "label": "공연 자료 · 사본",
      "input": "cms-sandbox/media/concerts",
      "output": "/cms-sandbox/media/concerts",
      "rename": false,
      "extensions": [
        "jpg",
        "pdf"
      ]
    }
  ],
  "content": [
    {
      "name": "concerts",
      "label": "기존 공연 수정 · 사본",
      "type": "collection",
      "path": "cms-sandbox/forms",
      "format": "json",
      "subfolders": false,
      "filename": {
        "template": "{fields.cms_id}.json",
        "field": false
      },
      "operations": {
        "create": false,
        "rename": false,
        "delete": false
      },
      "view": {
        "primary": "title",
        "fields": [
          "title",
          "date",
          "venue"
        ],
        "sort": [
          "date",
          "title"
        ],
        "search": [
          "title",
          "title_en",
          "date",
          "venue"
        ],
        "default": {
          "sort": "date",
          "order": "desc"
        }
      },
      "fields": [
        {
          "name": "title",
          "label": "공연명",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "\\S",
            "message": "공백이 아닌 내용을 입력해 주세요."
          }
        },
        {
          "name": "date",
          "label": "공연일",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "^[1-9][0-9]{3}(?:-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01]))?$",
            "message": "2026-05-20 또는 2026처럼 입력해 주세요."
          },
          "readonly": true,
          "description": "기존 공연의 날짜는 이번 검토에서 유지합니다."
        },
        {
          "name": "venue",
          "label": "장소",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "\\S",
            "message": "공백이 아닌 내용을 입력해 주세요."
          }
        },
        {
          "name": "title_en",
          "label": "공연명 · 영문 (선택)",
          "type": "string"
        },
        {
          "name": "venue_en",
          "label": "장소 · 영문 (선택)",
          "type": "string"
        },
        {
          "name": "works",
          "label": "작품 목록",
          "type": "object",
          "list": {
            "min": 1,
            "collapsible": {
              "collapsed": true,
              "summary": "{index}. {composer} · {work_title}"
            }
          },
          "fields": [
            {
              "name": "composer",
              "label": "작곡가",
              "type": "string",
              "required": true,
              "pattern": {
                "regex": "\\S",
                "message": "공백이 아닌 내용을 입력해 주세요."
              }
            },
            {
              "name": "work_title",
              "label": "작품명",
              "type": "string",
              "required": true,
              "pattern": {
                "regex": "\\S",
                "message": "공백이 아닌 내용을 입력해 주세요."
              }
            },
            {
              "name": "format",
              "label": "편성 (선택)",
              "type": "string",
              "description": "예: 2-ch Tape, Piano and Live Electronics"
            },
            {
              "name": "composer_en",
              "label": "작곡가 · 영문 (선택)",
              "type": "string"
            },
            {
              "name": "work_title_en",
              "label": "작품명 · 영문 (선택)",
              "type": "string"
            },
            {
              "name": "media_url",
              "label": "음원·영상 링크 (선택)",
              "type": "string",
              "pattern": {
                "regex": "^(?:https?://\\S+)?$",
                "message": "http:// 또는 https://로 시작하는 링크를 입력해 주세요."
              }
            }
          ]
        },
        {
          "name": "poster",
          "label": "포스터 (선택)",
          "type": "image",
          "options": {
            "media": "concert_trial_media",
            "extensions": [
              "jpg"
            ],
            "rename": false
          }
        },
        {
          "name": "program_book",
          "label": "프로그램북 PDF (선택)",
          "type": "file",
          "options": {
            "media": "concert_trial_media",
            "extensions": [
              "pdf"
            ],
            "rename": false
          }
        },
        {
          "name": "photos",
          "label": "공연 사진 (선택)",
          "type": "image",
          "options": {
            "media": "concert_trial_media",
            "extensions": [
              "jpg"
            ],
            "multiple": {
              "max": 20
            },
            "unique": true,
            "rename": false
          }
        },
        {
          "name": "cms_id",
          "type": "uuid",
          "hidden": true,
          "readonly": true,
          "options": {
            "editable": false,
            "generate": false
          }
        },
        {
          "name": "origin_id",
          "type": "string",
          "hidden": true,
          "readonly": true
        },
        {
          "name": "slug",
          "type": "string",
          "hidden": true,
          "readonly": true
        },
        {
          "name": "source_sha256",
          "type": "string",
          "hidden": true,
          "readonly": true,
          "default": "3dd85a1e7859d45f9224c6ab90c318c7fb0d2c160627d36fa4d30117078346db"
        }
      ]
    },
