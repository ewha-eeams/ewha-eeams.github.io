            {
              "name": "composer_en",
              "label": "작곡가 · 영문 (선택)",
              "type": "string"
            },
            {
              "name": "work_title_en",
              "label": "작품명 · 영문 (선택)",
              "type": "string"
            },
            {
              "name": "media_url",
              "label": "음원·영상 링크 (선택)",
              "type": "string",
              "pattern": {
                "regex": "^(?:https?://\\S+)?$",
                "message": "http:// 또는 https://로 시작하는 링크를 입력해 주세요."
              }
            }
          ]
        },
        {
          "name": "poster",
          "label": "포스터 (선택)",
          "type": "image",
          "description": "JPG 한 장을 선택하세요. 첨부한 뒤 Save를 눌러 공연에 연결합니다.",
          "options": {
            "media": "concert_trial_media",
            "extensions": [
              "jpg"
            ],
            "rename": false
          }
        },
        {
          "name": "program_book",
          "label": "프로그램북 PDF (선택)",
          "type": "file",
          "description": "3 MB를 넘는 PDF는 왼쪽의 자료 업로드 안내에서 원본을 올린 뒤 Select로 선택하세요. 연결 후 Save를 누릅니다.",
          "options": {
            "media": "concert_trial_media",
            "extensions": [
              "pdf"
            ],
            "rename": false
          }
        },
        {
          "name": "photos",
          "label": "공연 사진 (선택)",
          "type": "image",
          "description": "JPG를 최대 20장 선택할 수 있습니다. 첨부한 뒤 Save를 눌러 공연에 연결합니다.",
          "options": {
            "media": "concert_trial_media",
            "extensions": [
              "jpg"
            ],
            "multiple": {
              "max": 20
            },
            "unique": true,
            "rename": false
          }
        },
        {
          "name": "cms_id",
          "type": "uuid",
          "hidden": true,
          "readonly": true,
          "options": {
            "editable": false,
            "generate": false
          }
        },
        {
          "name": "origin_id",
          "type": "string",
          "hidden": true,
          "readonly": true
        },
        {
          "name": "slug",
          "type": "string",
          "hidden": true,
          "readonly": true
        },
        {
          "name": "source_sha256",
          "type": "string",
          "hidden": true,
          "readonly": true,
          "default": "851ecd06d8ad9ceb695944aca9450bf63406e970efcf433aa5d6cc6c762c1e63"
        }
      ]
    },
